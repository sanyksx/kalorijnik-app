<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Калорийник</title>
<meta name="description" content="Личный трекер калорий и КБЖУ">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2D7552" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<script src="platform.js"></script>
</head>
<body>
<style>
/* Калорийник: стили. Тема и цвета — :root в начале; правила с html:root — поздние правки с приоритетом. */
:root{--bg:#F1F3EC;--surface:#FFFFFF;--surface-2:#E7EBE1;--fg:#1B221D;--muted:#65705F;--line:#D6DCCD;--accent:#2D7552;--accent-fg:#FFFFFF;--accent-soft:#DCEBDF;--prot:#C9583A;--fat:#C98F1E;--carb:#3A70AA;--sleep:#6B5FC7;--warn:#B24A22;--warn-soft:#F6E2D8;--f-display:"Unbounded", "Manrope", system-ui, sans-serif;--f-body:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;--r:14px}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#111513;--surface:#1A1F1C;--surface-2:#242A26;--fg:#E6EBE3;--muted:#9AA595;--line:#303733;--accent:#62BC8D;--accent-fg:#0D1410;--accent-soft:#1F3328;--prot:#E7805F;--fat:#E2B24F;--carb:#6E9ED4;--sleep:#A79BEA;--warn:#E8895D;--warn-soft:#3A2419;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#111513;--surface:#1A1F1C;--surface-2:#242A26;--fg:#E6EBE3;--muted:#9AA595;--line:#303733;--accent:#62BC8D;--accent-fg:#0D1410;--accent-soft:#1F3328;--prot:#E7805F;--fat:#E2B24F;--carb:#6E9ED4;--sleep:#A79BEA;--warn:#E8895D;--warn-soft:#3A2419;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px calc(96px + env(safe-area-inset-bottom, 0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 6px;font-weight:600;max-width:55%}
.chip .ava{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.chip span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view{display:flex;flex-direction:column;gap:16px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;flex:none}
.iconbtn:disabled{opacity:.35;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.summary{display:grid;grid-template-columns:132px 1fr;gap:18px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.1}
.ring .c small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.ring.over .c b{color:var(--warn)}
.kline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;font-size:13px;color:var(--muted);margin-bottom:10px}
.kline span{white-space:nowrap}
.kline b{color:var(--fg)}
.macros{display:flex;flex-direction:column;gap:10px}
.mrow .lbl{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px}
.mrow .lbl span:first-child{font-weight:600}
.mrow .lbl span:last-child{color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .35s ease}
.p i{background:var(--prot)}
.f i{background:var(--fat)}
.u i{background:var(--carb)}
.bar.over i{background:var(--warn)}
@media (max-width:380px){
  .summary{grid-template-columns:1fr;justify-items:center}
  .summary .macros{width:100%}
}
.meal{display:flex;flex-direction:column;gap:2px}
.meal-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;padding:0 2px 6px}
.msum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:13px}
.msum b{font-weight:700;color:var(--fg)}
.msum .bju{display:flex;gap:8px;font-weight:600}
.meal-h.zero .msum{opacity:.45}
.meal-h h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:14px;letter-spacing:.01em}
.meal-h span{color:var(--muted);font-size:13px}
.entries{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.erow{display:grid;grid-template-columns:1fr auto;align-items:center;border-bottom:1px solid var(--line)}
.entry{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 4px 10px 12px;width:100%;border:0;background:none;text-align:left;min-width:0}
.xdel{width:32px;height:32px;margin-right:8px;border-radius:50%;border:0;background:var(--surface-2);color:var(--muted);font-size:13px;display:grid;place-items:center}
.xdel:hover{background:var(--warn-soft);color:var(--warn)}
#toast .undo{margin-left:12px;border:0;background:none;color:var(--accent-soft);font-weight:700;text-decoration:underline;padding:0}
.emo{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:22px;line-height:1}
.entry .t{min-width:0}
.entry .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .t small{color:var(--muted);font-size:12px}
.entry .k{font-weight:700;text-align:right;white-space:nowrap}
.entry .k small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.addrow{display:flex;align-items:center;gap:8px;width:100%;padding:11px 12px;border:0;background:none;color:var(--accent);font-weight:700;border-top:1px solid var(--line)}
.entries .addrow:first-child{border-top:0}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-weight:600}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
h2.sec{margin:4px 2px 0;font-family:var(--f-display);font-weight:600;font-size:17px;text-wrap:balance}
.muted{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.inp,select.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.result{display:flex;flex-direction:column;gap:12px}
.big{font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1;color:var(--accent)}
.big small{font-family:var(--f-body);font-size:15px;font-weight:600;color:var(--muted);margin-left:4px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right}
.note{font-size:13px;border-radius:10px;padding:10px 12px;background:var(--surface-2);color:var(--fg)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--accent-soft)}
.mpills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mp{border-radius:12px;background:var(--surface-2);padding:10px;text-align:center}
.mp b{display:block;font-size:18px}
.mp small{font-size:12px;color:var(--muted)}
.mp.p b{color:var(--prot)}
.mp.f b{color:var(--fat)}
.mp.u b{color:var(--carb)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{position:relative;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;text-align:left;min-width:0}
.pcard .emo{width:48px;height:48px;font-size:28px;border-radius:14px}
.pcard b{font-weight:600;line-height:1.25}
.pcard .kk{font-weight:700}
.pcard .kk small{font-weight:500;color:var(--muted)}
.pcard .bju{display:flex;gap:8px;font-size:12px}
.bju .p{color:var(--prot)}
.bju .f{color:var(--fat)}
.bju .u{color:var(--carb)}
.tag{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px}
.search{position:relative}
.search .inp{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
details.add{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.add summary{padding:14px 16px;font-weight:700;color:var(--accent);cursor:pointer;list-style:none}
details.add summary::-webkit-details-marker{display:none}
details.add .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.emopick{display:flex;flex-wrap:wrap;gap:6px}
.emopick button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:20px}
.emopick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.empty{padding:16px;text-align:center;color:var(--muted);font-size:14px}
.banner{display:flex;gap:10px;align-items:flex-start}
.banner .btn{padding:8px 12px;font-size:13px;flex:none}
.sync{font-size:12px;color:var(--muted);text-align:center}
.scrim{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom, 0px)}
.sheet-h{display:flex;justify-content:space-between;gap:10px}
.sheet-h h3{margin:0;font-family:var(--f-display);font-weight:500}
.sheet-b{overflow:auto;display:flex;flex-direction:column;gap:14px}
.pick{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pick button{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.pick button:last-child{border-bottom:0}
.pick button b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick button small{color:var(--muted);font-size:12px}
.pick .min{min-width:0}
.lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:2px 2px -6px}
.hero{display:flex;gap:14px;align-items:center}
.hero .emo{width:64px;height:64px;font-size:38px;border-radius:18px;background:var(--surface)}
.hero b{font-size:18px;display:block}
.gramsrow{display:flex;gap:10px;align-items:center}
.gramsrow .inp{font-size:24px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.calc div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px}
.calc b{display:block;font-size:18px}
.calc small{font-size:11px;color:var(--muted)}
.calc .k b{color:var(--accent)}
.calc .p b{color:var(--prot)}
.calc .f b{color:var(--fat)}
.calc .u b{color:var(--carb)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.multbox{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.multbox .quick{align-items:center}
.multbox .quick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
#shop-base{width:auto;padding:6px 10px;font-size:13px}
.shopseg button{font-size:13px;padding:7px 2px}
.shopinfo{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px}
.shopsum{font-size:14px}
.shopsec{display:flex;flex-direction:column;gap:6px}
.shoph{display:flex;align-items:center;gap:8px;padding:0 2px;font-family:var(--f-display);font-size:14px}
.shoph b{font-weight:500}
.shoplist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.shopextra .shoplist{border:0;border-radius:0;background:none}
.shoprow{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-bottom:1px solid var(--line)}
.shoprow:last-child{border-bottom:0}
.shoprow .emo{width:34px;height:34px;font-size:18px;border-radius:10px;flex:none}
.shoprow .min{flex:1;min-width:0}
.shoprow .min b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shopchk{flex:1;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;min-width:0;padding:4px}
.shopchk .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--accent-fg);flex:none}
.shopchk[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.shoprow .amt{font-weight:700;white-space:nowrap}
.shoprow.done .min b,.shoprow.done .amt{text-decoration:line-through;color:var(--muted)}
.shoprow .mini{flex:none}
details.shopextra>summary{list-style:none;cursor:pointer;font-weight:700}
details.shopextra>summary::-webkit-details-marker{display:none}
nav.tabs button{font-size:11px}
details.ovfold{border:1px dashed var(--line);border-radius:12px}
details.ovfold>summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:700;color:var(--accent);font-size:14px}
details.ovfold>summary::-webkit-details-marker{display:none}
details.ovfold .body{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.ovtag{font-size:11px;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:1px 6px;margin-left:4px}
.ovmark{color:var(--warn);font-weight:700}
#ovHint .linkbtn{color:var(--warn);text-align:left}
.chipt{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.chipt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.safter{font-size:11px!important}
.aok{color:var(--accent);font-weight:600}
.aoff{color:var(--warn);font-weight:600}
button,[data-act],.sw,.wc,.mc,label{touch-action:manipulation}
body::after{transform:translateZ(0)}
.cal{display:flex;flex-direction:column;gap:10px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.caltitle{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.caltitle b{font-weight:700}
.caltitle small{color:var(--muted);font-size:12px}
.caltitle .linkbtn{color:var(--accent);font-size:12px;padding:0}
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wc{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:4px 0;border-radius:12px;position:relative}
.wc small{font-size:11px;color:var(--muted);font-weight:600}
.wc.sel{background:var(--surface)}
.wc.sel small{color:var(--accent)}
.wc.td::after{content:"";position:absolute;bottom:1px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.wring{position:relative;width:38px;height:38px;display:grid;place-items:center}
.wring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.wring b{font-size:14px;font-weight:700;position:relative}
.wc.sel .wring b{color:var(--accent)}
.rc.ok{stroke:var(--accent)}
.rc.cur{stroke:var(--accent);opacity:.6}
.rc.low{stroke:var(--fat)}
.rc.high{stroke:var(--warn)}
.rc.plan{stroke:var(--muted)}
.wc:disabled,.mc:disabled{opacity:.3;cursor:default}
.mtitle{text-align:center;font-weight:700;font-size:14px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.mh{font-size:11px;color:var(--muted);font-weight:600;padding-bottom:2px}
.mc{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;border-radius:10px;padding:6px 0 5px;font-weight:600;font-size:14px}
.mc.sel{background:var(--surface);color:var(--accent)}
.mc.td span{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.dot{width:6px;height:6px;border-radius:50%;background:transparent;display:block}
.dot.ok{background:var(--accent)}
.dot.cur{background:var(--accent);opacity:.6}
.dot.low{background:var(--fat)}
.dot.high{background:var(--warn)}
.dot.plan{background:transparent;border:1.5px solid var(--muted);width:5px;height:5px}
.calfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.calsum{font-size:12px;color:var(--muted);flex:1;min-width:180px}
.calsum b{color:var(--fg)}
.calseg{flex:none}
.calseg button{padding:5px 12px;font-size:12px}
.sseg button{font-size:13px;padding:7px 4px}
.wd{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.wd b{font-size:13px}
.wd small{color:var(--muted);font-size:12px}
.spdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.spdays button{display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 2px;font-size:12px}
.spdays button small{color:var(--muted);font-size:10px}

/* ========== РАСЧЁТЫ: чистые функции без DOM, облака и состояния ==========
   Переносятся в приложение/бота как есть. Проверка: selfTest() (см. в конце файла).
   Норма — формула Миффлина — Сан-Жеора. */
function calc(p){
  const w=num(p.weight),h=num(p.height),a=num(p.age);
  if(!(w>30&&h>120&&a>=14)) return null;
  const bmr=10*w+6.25*h-5*a+(p.sex==="f"?-161:5);
  const tdee=bmr*num(p.act||1.2);
  const floor=Math.min(tdee,Math.max(p.sex==="f"?1200:1500,bmr));
  const pace=num(p.pace), manual=num(p.manual);
  const lim=x=>Math.min(tdee,Math.max(floor,x));
  let lo,hi,capped=false;
  if(manual>0){lo=hi=manual}
  else if(pace>0){
    // range: from the chosen deficit to 5% softer (e.g. 15% -> 10–15%)
    lo=lim(tdee*(1-pace)); hi=lim(tdee*(1-pace+0.05));
    capped=tdee*(1-pace)<floor;
  } else {lo=tdee*0.95;hi=tdee*1.05}
  lo=Math.round(lo); hi=Math.round(hi);
  const target=Math.round((lo+hi)/2);
  const hard=Math.round(tdee);               // тяжёлый день: до поддержания, без набора
  const bmi=w/Math.pow(h/100,2);
  const baseW=bmi>30?27*Math.pow(h/100,2):w;  // белок от скорректированного веса при ИМТ>30
  const pLo=Math.round(baseW*1.2), pHi=Math.round(baseW*2.0), prot=Math.round(baseW*1.6);
  const fLo=Math.round(Math.max(baseW*0.7,lo*0.20/9)), fHi=Math.max(fLo,Math.round(hi*0.35/9));
  const fat=Math.min(fHi,Math.max(fLo,Math.round(Math.max(baseW*0.9,target*0.25/9))));
  const carb=Math.max(0,Math.round((target-prot*4-fat*9)/4));
  const cLo=Math.max(0,Math.round((lo-prot*4-fat*9)/4)), cHi=Math.max(cLo,Math.round((hi-pLo*4-fLo*9)/4));
  const sugar=Math.round(target*0.10/4);
  const weekly=Math.max(0,(tdee-target)*7/7700);
  return {bmr,tdee,floor,lo,hi,target,hard,capped,manual:manual>0,bmi,prot,pLo,pHi,fat,fLo,fHi,carb,cLo,cHi,sugar,weekly,w};
}

const STREAK_MILES=[3,7,14,30,60,100,180,365];
let streakWin=0, streakBusy=false, streakKey="";
function weekKeyOf(d){const x=new Date(d+"T12:00:00"),wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return ymd(x)}
function dayInNorm(d,r){
  const D=days[keyFor(d)]; if(!D||!(D.entries||[]).length||!r) return false;
  const k=totals(D.entries).k; return k>=r.lo*0.9&&k<=r.hi*1.05;

function ensureStreakDays(n){
  const key=S.active+"|"+today(); if(streakKey!==key){streakKey=key;streakWin=0}
  if(streakBusy||streakWin>=n) return;
  streakBusy=true; const ds=[]; for(let i=streakWin;i<n;i++) ds.push(nextDaysFrom(today(),-i));
  Promise.all(ds.map(getDayData)).then(()=>{streakWin=n;streakBusy=false;if(tab==="diary"&&!sheet)renderSoon();if(sheet&&sheet.mode==="streak")renderSheet()},()=>{streakBusy=false});
}
function streakInfo(){
  const r=calc(prof()); if(!r) return {n:0,frozen:[],ok:[],todayOk:false,loading:false};
  if(streakWin<35) ensureStreakDays(35);
  const td=today(), todayOk=dayInNorm(td,r), usedWeeks=new Set(), frozen=[], ok=[];
  let n=todayOk?1:0, i=1, firstData=null;
  if(todayOk) ok.push(td);
  for(;i<streakWin;i++){
    const d=nextDaysFrom(td,-i);
    if(dayInNorm(d,r)){n++;ok.push(d);continue}
    const wk=weekKeyOf(d), prev=nextDaysFrom(d,-1);
    // заморозка: одна на календарную неделю и только если день перед ним был в норме
    if(!usedWeeks.has(wk)&&dayInNorm(prev,r)){usedWeeks.add(wk);frozen.push(d);continue}
    break;
  }
  const loading=i>=streakWin&&streakWin<366;
  if(loading) ensureStreakDays(Math.min(366,streakWin+35));
  const p=prof();
  if(!loading&&n>(p.bestStreak||0)){p.bestStreak=n;saveMain()}
  if(!loading){const m=STREAK_MILES.filter(x=>n>=x).pop()||0;if(m&&(p.streakMile||0)<m&&(p.streakMileDay!==td)){p.streakMile=m;p.streakMileDay=td;saveMain();setTimeout(()=>toast("🔥 "+plural(m,"день","дня","дней")+" подряд в норме!"),400);streakFlash=true}
    else if(m<(p.streakMile||0)&&n<3){p.streakMile=0;saveMain()}}
  return {n,frozen,ok,todayOk,loading,best:Math.max(p.bestStreak||0,n),r};
}
let streakFlash=false;
function streakPill(){

  const s=streakInfo(), fr=s.frozen.length&&s.frozen[0]>=nextDaysFrom(today(),-6);

}

let wHistReq="";

function weightForecast(p,r){
  const gw=num(p.gweight); if(!(gw>30)) return null;
  const H=weightHist(), cw=H.length?H[H.length-1][1]:num(p.weight); if(!(cw>30)) return null;
  const diff=cw-gw, dir=diff>0?-1:1;
  if(Math.abs(diff)<0.3) return {gw,cw,done:true};
  let rate=0, src="", span=0;
  const recent=H.filter(x=>x[0]>=nextDaysFrom(today(),-28));
  if(recent.length>=3){
    const t0=new Date(recent[0][0]+"T12:00:00").getTime(), xs=recent.map(x=>(new Date(x[0]+"T12:00:00").getTime()-t0)/864e5), ys=recent.map(x=>x[1]);

}

const BRAND_RU=[[/лейс|лэйс|лейз/g,"lay's"],[/принглс/g,"pringles"],[/читос|читоз/g,"cheetos"],[/доритос/g,"doritos"],[/экспонент\S*/g,"exponenta"],[/эпик\S*/g,"epica"],[/раф+а[эе]л+о/g,"raffaello"],[/ферр?еро|роше/g,"ferrero rocher"],[/мерси/g,"merci"],[/тоф+и[фф]+и/g,"toffifee"],[/альпен\s*голд|альпенгольд|альпен\s*гольд/g,"alpen gold"],[/чоко\s*па[йи]|чокопа[йи]/g,"choco pie"],[/сникерс/g,"snickers"],[/харибо/g,"haribo"],[/чупа[\s-]*чупс/g,"chupa chups"],[/тук\b/g,"tuc"],[/киндер/g,"kinder"],[/орео/g,"oreo"],[/наттс|натс/g,"nuts"],[/милка/g,"milka"]];

/* ---------- Состояние продукта: сырое / готовое ---------- */
const COOK={raw:["🧊","сырое","#6E8CA8"],dry:["🌾","сухое","#B8955A"],boil:["💧","варёное","#3F86C9"],fry:["🔥","жареное","#E07B2A"],bake:["♨️","запечённое","#B5543A"],stew:["🍲","тушёное","#9A6B3F"],smoke:["🥓","копч./солён.","#9C3D54"],ready:["✅","готовое","#3E9A5C"]};
const COOK_CATS=new Set(["meat","poultry","pork","processed","fish","seafood","grains","eggs","veg","dishes","mydish","fastfood"]);
const COOK_RAWISH=new Set(["raw","dry"]);
const ckMemo=new Map();
function cookOf(p){
  if(!p) return null;
  if(p.cook) return COOK[p.cook]?p.cook:null;
  const cat=p.cat||"other"; if(!COOK_CATS.has(cat)) return null;
  const key=cat+"|"+p.name; if(ckMemo.has(key)) return ckMemo.get(key);
  const n=normT(p.name), DISH=cat==="dishes"||cat==="mydish"||cat==="fastfood";
  let r=null;
  if(/копч|солен|вялен|квашен|маринов|(?<![а-я])сало(?![а-я])|икра/.test(n)) r="smoke";
  else if(/туш[её]н|гуляш|рагу|голубц|тефтел/.test(n)) r="stew";
  else if(/жарен|(?<![а-я])фри(?![а-я])|наггет|стрипс|чебурек|беляш|яичниц|омлет|по-киевски|крылышки/.test(n)) r="fry";
  else if(/запеч|гриль|печен(ый|ая|ое|ые)(?![а-я])|буженин|лазань|по-деревенски/.test(n)) r="bake";
  else if(DISH) r="ready";
  else if(/(?<![а-я])сыр(ой|ая|ое|ые)(?![а-я])/.test(n)) r="raw";
  else if(/\(сух|(?<![а-я])сух(ой|ая|ое|ие)(?![а-я])/.test(n)) r="dry";
  else if(/варен|вареник|каша|овсянка на|сосиски|сардельки|пельмен/.test(n)) r="boil";
  else if(/консерв|в собств|в масле|шпрот|хумус|тофу|крабов|оливки|морская капуста|колбас|ветчин|салями|котлета|блины|голубцы/.test(n)) r="ready";
  else if(cat==="processed") r="ready";
  else if(cat==="grains") r="dry";
  else if(cat==="veg") r=/картоф|батат|свекл|фасоль|чечевиц|нут|горох|тыкв|баклажан|кабач|шампиньон|грибы/.test(n)?"raw":null;
  else r="raw";
  ckMemo.set(key,r); return r;
}

function localTextParse(text){
  const parts=String(text).split(/\n|,|;|\s+и\s+|\s+плюс\s+|\s\+\s/i).map(x=>x.trim()).filter(x=>x.length>=2);
  const items=[], miss=[];
  const pool=visibleProducts();
  for(const raw of parts){
    const n0=normT(raw), qm=/(\d+(?:[.,]\d+)?)\s*(кг|г|гр|грамм\S*|мл|л|шт\S*)?(?![а-я])/.exec(n0);
    const nm=n0.replace(/(\d+(?:[.,]\d+)?)\s*(кг|г|гр|грамм\S*|мл|л|шт\S*)?(?![а-я])/,"").replace(/\s+/g," ").trim();
    const rawPen=p=>["grains","veg"].includes(p.cat)&&COOK_RAWISH.has(cookOf(p))&&!/сух|сыр/.test(n0)?100:0;
    const full=nm.length>=4?pool.filter(p=>normT(p.name).includes(nm)).sort((a,b)=>(a.name.length+rawPen(a))-(b.name.length+rawPen(b)))[0]:null;
    if(full){
      let g=full.pc>=4?full.pc:portionOf(full);
      if(qm){const q=num(qm[1]),u=qm[2]||"";g=/^кг/.test(u)?q*1000:/^л$/.test(u)?q*1000:/^(г|гр|грамм|мл)/.test(u)?q:(q<20?q*(full.pc||100):q)}
      items.push({p:full,g:Math.max(5,Math.round(g))});continue;
    }
    const r=parseLine(raw);
    if(!r||r.skip) continue;
    if(r.unres){if(r.p&&r.noQty){items.push({p:r.p,g:roundG(r.p,r.p.pc>=4?r.p.pc:portionOf(r.p))})}else miss.push(raw);continue}
    let P=r.p,G=r.g;
    if(["grains","veg"].includes(P.cat)&&COOK_RAWISH.has(cookOf(P))&&!/сух|сыр/.test(n0)){const ck=Object.keys(RAW).find(k=>RAW[k].length===1&&RAW[k][0][0]===P.id);const cp=ck&&findProduct(ck);if(cp&&!isHidden(cp)){P=cp;if(!qm||!qm[2])G=portionOf(cp)}}
    items.push({p:P,g:Math.max(5,Math.round(G))});
  }
  return {items,miss};
}

function repStats(ds,r){

function repChart(rows,r){

  if(r){const y1=top+ch*(1-r.hi/max),y0=top+ch*(1-r.lo/max);svg+=`<rect x="0" y="${y1}" width="${W}" height="${Math.max(1,y0-y1)}" fill="var(--accent)" opacity=".13" rx="3"/>`}
  rows.forEach((x,i)=>{

  });
  return svg+`</svg>`;
}

const weekReq=new Set();
let calMode="week", calMonth=null;
const maxFuture=()=>nextDays(31)[30];
function ensureDays(ds,cb){
  const miss=ds.filter(d=>!days[keyFor(d)]&&!weekReq.has(keyFor(d)));
  if(!miss.length) return;
  miss.forEach(d=>weekReq.add(keyFor(d)));
  Promise.all(miss.map(d=>getDayData(d))).then(()=>{
    miss.forEach(d=>{const k=keyFor(d);if(!days[k])days[k]={entries:[]}});
    const a=document.activeElement;

function dayStat(d,r){
  const D=days[keyFor(d)], td=today();
  if(!D||!(D.entries||[]).length) return {cls:"none",k:0,pct:0};
  const k=totals(D.entries).k;
  let cls;
  if(r&&k>r.hi*1.05) cls="high"; else if(d>td) cls="plan"; else if(d===td) cls="cur"; else if(r&&k<r.lo*0.9) cls="low"; else cls="ok";
  return {cls,k,pct:r?Math.min(1,k/r.hi):0};
}
function weekDates(d){const x=new Date(d+"T12:00:00"),wd=(x.getDay()+6)%7;const out=[];for(let i=0;i<7;i++){const y=new Date(x);y.setDate(x.getDate()-wd+i);out.push(ymd(y))}return out}
function monthDates(m){const [Y,M]=m.split("-").map(Number);const first=new Date(Y,M-1,1,12),wd=(first.getDay()+6)%7,n=new Date(Y,M,0).getDate();const cells=[];for(let i=0;i<wd;i++)cells.push(null);for(let i=1;i<=n;i++)cells.push(ymd(new Date(Y,M-1,i,12)));return cells}
function periodSum(ds,r){
  const td=today(); let sum=0,n=0,def=0;
  ds.forEach(d=>{if(!d||d>=td)return;const D=days[keyFor(d)];if(!D||!(D.entries||[]).length)return;const k=totals(D.entries).k;sum+=k;n++;if(r)def+=r.tdee-k});
  return {n,avg:n?sum/n:0,def,kg:def/7700};
}

function dishCalc(){
  let raw=0,K=0,P=0,F=0,C=0;
  dish.items.forEach(it=>{const g=num(it.g),m=g/100;raw+=g;K+=it.k*m;P+=it.p*m;F+=it.f*m;C+=it.c*m});
  const cooked=num(dish.cooked)||raw, portions=Math.round(num(dish.portions));
  const per=cooked>0?100/cooked:0;
  return {raw,cooked,portions,K,P,F,C,k:K*per,p:P*per,f:F*per,c:C*per};
}

function measuresFor(p){

  const n=normT(p.name||""), c=p.cat||"other", id=p.id, out=[];
  const add=(nm,g)=>{if(g>0&&!out.some(x=>x[1]===g))out.push([nm,Math.round(g)])};

  if(c==="fats"){add("ч. л.",ts||6);add("ст. л.",tb||(/майонез|соус|сметан/.test(n)?20:15));return out}
  if(/сахар|мед|варень|сгущ|шоколадная паста|арахисовая паста|сироп/.test(n)){add("ч. л.",ts||(/паст/.test(n)?10:8));add("ст. л.",tb||(/паст/.test(n)?20:25));return out}

    if(/молоко|кефир|ряженк|айран|сливк|снежок/.test(n)){add("ст. л.",15);add("стакан",200);add("кружка",250);return out}
    if(/сметан|йогурт|творог|рикотт|творожн/.test(n)){add("ст. л.",/творог|зернен/.test(n)?25:20);if(!/йогурт.*наполн|актив|чудо|растишк/.test(n))add("стакан",/творог/.test(n)?150:200);return out}
    if(/сыр/.test(n)&&!/сырник|сырок/.test(n)){add("ломтик",20);add("2 ломтика",40);return out}
  }
  if(c==="processed"&&/колбас|ветчин|салями|буженин/.test(n)){add("ломтик",15);add("3 ломтика",45);return out}
  if(c==="bread"){if(/хлеб(?!ц)|батон|бородин/.test(n)){add("ломтик",30);add("2 ломтика",60)}else if(/лаваш/.test(n))add("½ листа",40);return out}
  if(c==="grains"){
    if(COOK_RAWISH.has(cookOf(p))||/мука|крахмал|хлопь/.test(n)){add("ст. л.",/мука|крахмал/.test(n)?25:20);add("стакан",GLASS[id]||(/хлопь/.test(n)?90:180));return out}
    add("ст. л.",30);add("½ тарелки",150);add("тарелка",250);return out
  }
  if(c==="dishes"||c==="mydish"){
    if(/суп|борщ|щи|солянк|рассольн|уха|окрошк/.test(n)){add("половник",120);add("тарелка",300);return out}
    if(/салат|оливье|винегрет|шуба|мимоз/.test(n)){add("ст. л.",30);add("тарелка",200);return out}
    add("½ тарелки",150);add("тарелка",250);return out
  }
  if(c==="nuts"){add("ст. л.",15);add("горсть",30);return out}
  if(c==="fruit"&&!(p.pc>=40)){add("горсть",50);add("стакан",150);return out}
  if(c==="veg"&&/салат|шпинат|зелен/.test(n)){add("горсть",30);add("тарелка",100);return out}
  if(c==="veg"&&/фасол|нут|горош|кукуруз|чечевиц/.test(n)){add("ст. л.",30);add("½ стакана",100);return out}

}
const PIECE={onion:80,carrot:80,potatoraw:100,potato:100,pepper:150,beet:200,zucchini:300,eggplant:250,lemon:100,garlic:5,cucumber:120,tomato:120,chicken:250,chthigh:120,chdrum:100};
const TBSP={sunoil:17,olive:17,butter:17,sugar:25,honey:30,flour:25,starch:25,smetana:20,tomatopaste:25,mayo:20,soysauce:18,crumbs:15};
const TSP={sugar:8,honey:10,flour:8,starch:8,sunoil:5,olive:5,soysauce:6};
const GLASS={ricedry:185,buckdry:165,flour:130,sugar:200,oats:90,semolina:160,millet:180,lentils:180,water:200,milk:200,kefir:200};
const STEMS=w=>w.length>4?w.slice(0,Math.max(4,w.length-2)):w;
function matchProduct(name){
  const sc=scoreProduct(name);
  if(sc&&sc.sure&&sc.n>=2) return sc;               // «ветчина из индейки», «лейс краб» — точное совпадение важнее синонимов
  for(const [re,id] of SYN){if(re.test(name)){const p=findProduct(id);if(p)return {p,sure:true}}}
  return sc;
}
function scoreProduct(name){
  let words=name.split(/[^а-яa-z]+/).filter(w=>w.length>=3);
  const core=words.filter(w=>!/^(филе|мякот|кусо|тушк|ломт|кусоч|вес|упак)/.test(w));
  if(core.length) words=core;
  if(!words.length) return null;
  let best=null,bs=0;
  for(const p of allProducts()){
    if(p.cat==="dishes"||p.cat==="mydish") continue;
    const pn=normT(p.name); let hit=0;
    words.forEach(w=>{if(pn.includes(STEMS(w)))hit++});
    let sc=hit/words.length;
    if(hit&&pn.startsWith(STEMS(words[0]))) sc+=0.2;
    if(/вар|жар|запеч|готов|консерв/.test(pn)&&!/вар|жар|запеч|готов|консерв/.test(name)) sc-=0.15;
    if(sc>bs){bs=sc;best=p}
  }
  return bs>=0.5?{p:best,sure:bs>=1,n:words.length}:null;
}
function parseLine(raw){
  let s=normT(raw).replace(/^[\s\-–—•*·\d]+[.)]\s+/,"").replace(/^[\-–—•*·]\s*/,"").trim();
  if(!s||s.length<2) return null;
  if(/:$/.test(s)&&!/\d/.test(s)) return null;                    // section header
  s=s.replace(/[—–:]/g," ").replace(/½/g," 0.5").replace(/¼/g," 0.25").replace(/¾/g," 0.75").replace(/(\d),(\d)/g,"$1.$2");
  const name0=s.replace(/\(.*?\)/g," ");
  if(SKIP_RE.test(name0)) return {skip:true,raw};
  const numRe="(\\d+(?:\\.\\d+)?(?:\\s*\\/\\s*\\d+)?(?:\\s*-\\s*\\d+(?:\\.\\d+)?)?)";
  const unitRe="(кг|килограмм\\S*|г(?![а-я])|гр(?![а-я])|гр\\.|грамм\\S*|мл(?![а-я])|миллилитр\\S*|л(?![а-я])|литр\\S*|ст\\.?\\s*л\\.?|столов\\S*\\s+ложк\\S*|ч\\.?\\s*л\\.?|чайн\\S*\\s+ложк\\S*|стакан\\S*|шт\\.?|штук\\S*|зубч\\S*|долек|дольк\\S*|луковиц\\S*|пучк?\\S*|банк\\S*|упаковк\\S*|пачк\\S*)?";
  const qsrc=name0.replace(/\d+(?:\.\d+)?\s*%/g," ");
  const m=new RegExp(numRe+"\\s*"+unitRe,"i").exec(qsrc);
  let qty=null,unit="";
  if(m){
    let q=m[1].replace(/\s/g,"");
    if(q.includes("-")){const [a,b]=q.split("-").map(Number);q=String((a+b)/2)}
    if(q.includes("/")){const [a,b]=q.split("/").map(Number);q=String(a/b)}
    qty=parseFloat(q); unit=(m[2]||"").replace(/\s+/g," ");
  }
  let name=qsrc.replace(m?m[0]:"","").replace(/(^|\s)(свеж\S*|охлажд\S*|заморож\S*|крупн\S*|средн\S*|небольш\S*|мелк\S*|нарезан\S*|очищен\S*|отварн\S*|без кост\S*|без кож\S*|по желани\S*|примерно|около)(?=\s|$)/g," ").replace(/[,;.]+/g," ").replace(/\s+/g," ").trim();
  if(!name) return null;
  const mt=matchProduct(name);
  if(!mt) return {unres:true,raw,name};
  const p=mt.p, id=p.id;
  if(qty===null) return {unres:true,raw,name,p,noQty:true};
  let g;
  if(/^кг|^килограмм/.test(unit)) g=qty*1000;
  else if(/^л(?![а-я])|^литр/.test(unit)) g=qty*1000*(p.cat==="fats"?0.92:1);
  else if(/^мл|^миллилитр/.test(unit)) g=qty*(p.cat==="fats"?0.92:1);
  else if(/^стакан/.test(unit)) g=qty*(GLASS[id]||200);
  else if(/^ст\.?\s*л|^столов/.test(unit)) g=qty*(TBSP[id]||15);
  else if(/^ч|чайн/.test(unit)) g=qty*(TSP[id]||5);
  else if(/^стакан/.test(unit)) g=qty*(GLASS[id]||200);
  else if(/^зубч|^дол/.test(unit)) g=qty*5;
  else if(/^пуч/.test(unit)) g=qty*30;
  else if(/^банк/.test(unit)) g=qty*(id==="tuna"?185:id==="corn"||id==="peas"?340:id==="beans"?400:300);
  else if(/^упак|^пач/.test(unit)) g=qty*(id==="butter"?180:id==="cottage5"||id==="cottage0"?200:250);
  else if(/^г|^гр|грамм/.test(unit)) g=qty;
  else if(/^шт|штук|луковиц/.test(unit)||(!unit&&qty<20)) g=qty*(p.pc||PIECE[id]||100);
  else g=qty;
  return {p,g:Math.round(g),raw,sure:mt.sure};
}
function parseRecipe(text){
  const res={added:0,doubt:0,unres:[],skipped:[]};
  for(const line of String(text).split(/\n+/)){
    const r=parseLine(line); if(!r) continue;
    if(r.skip){res.skipped.push(line.trim());continue}
    if(r.unres){res.unres.push({raw:line.trim(),name:r.name,pid:r.p&&r.p.id,noQty:!!r.noQty});continue}
    const p=r.p;
    dish.items.push({pid:p.id,name:p.name,emoji:p.emoji,k:p.k,p:p.p,f:p.f,c:p.c,g:r.g,src:line.trim(),doubt:!r.sure});
    res.added++; if(!r.sure) res.doubt++;
  }
  return res;
}

function actsChart(dates,stepK,actK){
  const W=330,H=70,top=6,bot=14,ch=H-top-bot,n=dates.length,step=W/n;
  const max=Math.max(1,...dates.map((_,i)=>stepK[i]+actK[i]));
  let svg=`<svg viewBox="0 0 ${W} ${H}" class="mch" aria-hidden="true">`;
  dates.forEach((d,i)=>{
    const h1=ch*stepK[i]/max, h2=ch*actK[i]/max, x=i*step+step*0.3, bw=step*0.4;
    if(h1>0) svg+=`<rect x="${x}" y="${top+ch-h1}" width="${bw}" height="${h1}" rx="3" fill="var(--c-burn)" opacity=".4"/>`;
    if(h2>0) svg+=`<rect x="${x}" y="${top+ch-h1-h2}" width="${bw}" height="${h2}" rx="3" fill="var(--c-burn)"/>`;
    const tot=stepK[i]+actK[i]; if(tot>0) svg+=`<text x="${x+bw/2}" y="${Math.max(9,top+ch-h1-h2-2)}" text-anchor="middle" font-size="8" fill="var(--muted)">${fmt(tot)}</text>`;
    const dt=new Date(d+"T12:00:00"); svg+=`<text x="${i*step+step/2}" y="${H-2}" text-anchor="middle" font-size="9" fill="var(--muted)">${DOW[dt.getDay()]}</text>`;
  });
  return svg+`</svg>`;
}

let assetsNS=null, bgBusy=false;
async function uploadBg(file){
  const msg=$("#bgMsg"); if(!file) return;
  if(!/^image\//.test(file.type)){toast("Нужна картинка: JPG или PNG");return}
  try{
    if(!assetsNS&&window.claude&&window.claude.use) assetsNS=await claude.use("assets");

    cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);

    const blob=await new Promise(res=>cv.toBlob(res,"image/jpeg",0.82));
    const up=await assetsNS.upload(blob);
    const p=prof(), old=p.bg&&p.bg.type==="img"?p.bg.id:null;
    p.bg={type:"img",url:up.url,id:up.id,dim:0.45}; saveMain(); applyTheme();

  }catch(e){if(msg)msg.textContent="Не удалось загрузить картинку. Попробуйте другую или поменьше.";}

  h+=`<div class="row"><button class="btn ghost" data-act="shopcopy">📋 Скопировать список</button><button class="btn ghost" data-act="shopreset">Сбросить отметки</button></div>

  return h;
}

function renderSheet(anim){

function plural(n,a,b,c){const m=n%10,h=n%100;return n+" "+(m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c)}
function catTiles(list,scope){

}
function groupHead(k,scope){const c=CATS.find(x=>x[0]===k)||["other","Другое","🍽️"];return `<div class="grouphead"><button class="backbtn" data-act="catback" data-scope="${scope}">‹ Все группы</button><h3><span aria-hidden="true">${c[2]}</span> ${c[1]}</h3></div>`}
function pickCard(p){return `<button class="pcard pickc" data-pick="${p.id}">${tileTop(p)}</button>`}
function renderPickList(){
  const el=$("#pickList"); if(!el) return;
  const q=sheet.q||"";
  const vis=visibleProducts();
  let h="";
  if(q){
    const list=vis.filter(p=>matches(p,q));
    const hidN=allProducts().filter(p=>isHidden(p)&&matches(p,q)).length;
    h+=`<div class="lab">Найдено: ${list.length}</div>`;
    h+=list.length?`<div class="pgrid">${list.map(pickCard).join("")}</div>`:`<div class="empty">Такого продукта нет в базе.</div>`;
    h+=`<button class="btn ghost wide" data-act="newfromsearch">＋ Добавить «${esc(q)}» как свой продукт</button>`;
    if(hidN) h+=`<div class="muted" style="font-size:13px;text-align:center">Ещё ${hidN} в списке «Не ем» этого профиля</div>`;

      h+=groupHead(sheet.cat,"pick")+`<div class="subgrid">${subs.map(x=>`<button type="button" class="subtile" data-psub="${x.k}">${cemo(x.em,sheet.cat)}<b>${esc(x.n)}</b><small class="num">${plural(x.c,"продукт","продукта","продуктов")}</small></button>`).join("")}<button type="button" class="subtile all" data-psub="*">${cemo((CATS.find(c=>c[0]===sheet.cat)||[])[2]||"🍽️",sheet.cat)}<b>Все сразу</b><small class="num">${plural(inCat.length,"продукт","продукта","продуктов")}</small></button></div>`;
    } else {
      const list0=sheet.sub&&sheet.sub!=="*"?inCat.filter(p=>subOf(p)===sheet.sub):inCat, list=sortProds(ckFilter(list0));
      const sb=subs.find(x=>x.k===sheet.sub);
      h+=(subs.length?`<div class="grouphead"><button class="backbtn" data-act="psubback">‹ ${esc((CATS.find(c=>c[0]===sheet.cat)||["","Группа"])[1])}: подгруппы</button><h3>${sb?sb.em+" "+esc(sb.n):"Все"}</h3></div><div class="subchips">${[["*","Все"],...subs.map(x=>[x.k,x.em+" "+x.n])].map(([k,n])=>`<button type="button" data-psub="${k}" aria-pressed="${sheet.sub===k}">${esc(n)}</button>`).join("")}</div>`:groupHead(sheet.cat,"pick"))+ckChips(list0)+sortChips(list0)+(list.length?`<div class="pgrid">${list.map(pickCard).join("")}</div>`:`<div class="empty">Здесь таких нет.</div>`);
    }
  } else {
    h+=quickHTML();
    h+=`<div class="lab">Группы</div>`+catTiles(vis,"pick");
  }
  el.innerHTML=h;
}
function eff(){return sheet.ov?{...sheet.product,...sheet.ov}:sheet.product}
function readOv(){
  const g=num(sheet.g)||100, mul=sheet.ovMode==="portion"?100/g:1, b=sheet.product;
  const v=x=>{const el=$("#ov-"+x);return el&&el.value.trim()!==""?num(el.value)*mul:b[x]};
  sheet.ov={k:v("k"),p:v("p"),f:v("f"),c:v("c")};
}
function ovVal(x){const e=eff(), g=num(sheet.g)||100, m=sheet.ovMode==="portion"?g/100:1;return Math.round(e[x]*m*10)/10}
function syncOvFields(){if(!sheet||!sheet.ov||sheet.ovMode!=="portion")return;["k","p","f","c"].forEach(x=>{const el=$("#ov-"+x);if(el&&document.activeElement!==el)el.value=String(ovVal(x)).replace(".",",")});renderOvHint()}
function renderOvHint(){
  const el=$("#ovHint"); if(!el) return;
  const e=eff(), est=e.p*4+e.f*9+e.c*4;
  if(sheet.ov&&Math.abs(est-e.k)>Math.max(15,e.k*0.1)){const m=sheet.ovMode==="portion"?(num(sheet.g)||100)/100:1;el.innerHTML=`<button type="button" class="linkbtn" data-act="ovkcal">Калории не сходятся с БЖУ. Пересчитать → ${fmt(est*m)} ккал</button>`}
  else el.innerHTML="";
}
function ovHTML(){
  const b=sheet.product, u=unitOf(b), mode=sheet.ovMode||"100";
  const f=x=>sheet.ov?String(ovVal(x)).replace(".",","):"";
  return `<details class="ovfold"${sheet.ov?" open":""}><summary>✎ Изменить КБЖУ для этой записи${sheet.ov?" <span class=\"ovtag\">изменено</span>":""}</summary><div class="body">
    <div class="seg" id="ovMode">${[["100","на 100 "+u],["portion","на всю порцию"]].map(([k,n])=>`<button type="button" data-ovmode="${k}" aria-pressed="${k===mode}">${n}</button>`).join("")}</div>
    <div class="grid4">${[["k","Ккал"],["p","Белки"],["f","Жиры"],["c","Углев."]].map(([x,n])=>`<div class="field"><label for="ov-${x}">${n}</label><input class="inp num" id="ov-${x}" inputmode="decimal" placeholder="${String(mode==="portion"?Math.round(b[x]*(num(sheet.g)||100)/10)/10:b[x]).replace(".",",")}" value="${f(x)}"></div>`).join("")}</div>
    <div class="muted num fs12">В базе: ${fmt(b.k)} ккал · Б ${f1(b.p)} · Ж ${f1(b.f)} · У ${f1(b.c)} на 100 ${u}. Изменится только эта запись в этот день.</div>
    <div id="ovHint"></div>
    <div class="row">${sheet.ov?`<button type="button" class="btn ghost" data-act="ovreset">Вернуть как в базе</button><button type="button" class="btn ghost" data-act="ovsave">Сохранить как свой продукт</button>`:""}</div>
  </div></details>`;
}
function renderCalc(){
  const el=$("#calcBox"); if(!el) return;
  const p=eff(), m=num(sheet.g)/100;
  el.innerHTML=`<div class="k"><b class="num">${fmt(p.k*m)}</b><small>ккал</small></div><div class="p"><b class="num">${f1(p.p*m)}</b><small>белки</small></div><div class="f"><b class="num">${f1(p.f*m)}</b><small>жиры</small></div><div class="u"><b class="num">${f1(p.c*m)}</b><small>углев.</small></div>`;
}

function wsRead(){
  const r=sheet&&sheet.res; if(!r) return;
  const g=id=>{const i=$("#"+id);return i?i.value:null};
  const st=g("ws-steps"),b=g("ws-bed"),w=g("ws-wake"),sh=g("ws-sh");
  if(st!==null) r.steps=Math.max(0,Math.round(num(st)));
  if(b!==null) r.bed=b; if(w!==null) r.wake=w; if(sh!==null) r.sh=num(String(sh).replace(",","."));
}
async function readWatch(file){
  if(!file||!sheet||sheet.mode!=="wsync") return;
  if(!AI.ok){sheet.msg="Распознавание здесь недоступно";renderSheet();return}
  sheet.busy=true; sheet.msg=""; renderSheet();
  const cur=WSRC.find(x=>x[0]===prof().wsrc);
  const prompt=`На скриншоте приложение фитнес-часов, браслета или шагомера${cur?" (скорее всего "+cur[1]+")":""}. Найди данные за один день и верни ТОЛЬКО JSON такого вида:
{"date":"","steps":0,"sleep":{"bed":"","wake":"","h":0},"acts":[{"type":"run","name":"Бег","min":0,"kcal":0}],"note":""}
steps — шаги за день, 0 если не видно. sleep.bed и sleep.wake — время отбоя и подъёма в формате ЧЧ:ММ (24 часа), пусто если не видно; sleep.h — общая длительность сна в часах (например 7.5), 0 если не видно. acts — тренировки на экране; type строго одно из: ${ACTS.map(a=>a[0]).join(", ")}; name — название на русском; min — длительность в минутах; kcal — калории тренировки, если указаны, иначе 0. date — дата данных в формате ГГГГ-ММ-ДД, если она видна, иначе пусто. Не придумывай: бери только то, что явно видно на экране. В note одной фразой напиши, за какой день данные и в чём не уверен. Если на скриншоте нет таких данных — верни нули и объясни в note.`;
  try{
    const r=await AI.json(prompt,{images:[file],modelTier:"default"});
    if(!sheet||sheet.mode!=="wsync") return;
    const sl=(r&&r.sleep)||{}, tm=v=>/^\d{1,2}:\d{2}$/.test(String(v||"").trim())?String(v).trim().padStart(5,"0"):"";
    const acts=(r&&Array.isArray(r.acts)?r.acts:[]).filter(a=>a&&(num(a.min)>0||num(a.kcal)>0)).slice(0,6).map(a=>{
      const type=ACTS.some(x=>x[0]===a.type)?a.type:"other", min=Math.round(num(a.min)), own=num(a.kcal)>0;
      return {type,name:String(a.name||"").slice(0,30),min,kcal:own?Math.round(num(a.kcal)):actKcal(type,min,1,actWeight(curDay())),own,on:true};
    });
    const res={steps:Math.max(0,Math.round(num(r&&r.steps))),bed:tm(sl.bed),wake:tm(sl.wake),sh:Math.round(num(sl.h)*10)/10,acts,note:""};
    const notes=[]; if(r&&r.note) notes.push(String(r.note).slice(0,200));
    const dt=r&&/^\d{4}-\d{2}-\d{2}$/.test(r.date||"")?r.date:"";
    if(dt&&dt!==day) notes.unshift("Похоже, это данные за "+fmtD(dt)+", а запись будет в "+fmtD(day)+". Если нужно другое число — закройте окно и выберите день в календаре.");
    res.note=notes.join(" ");
    sheet.busy=false;
    if(!res.steps&&!res.bed&&!res.sh&&!acts.length){sheet.msg="Не нашёл на скриншоте шагов, сна или тренировок."+(r&&r.note?" "+r.note:"");renderSheet();return}
    sheet.res=res; renderSheet();
  }catch(e){
    const c=e&&e.code; logErr("watch",c||(e&&e.message)||"err");
    if(!sheet||sheet.mode!=="wsync") return;
    sheet.busy=false; sheet.msg=c==="not_granted"?"Нет разрешения обращаться к Claude":c==="rate_limited"?"Слишком много запросов, попробуйте через минуту":c==="image_rejected"?"Этот файл не подходит, нужен скриншот":"Не удалось распознать скриншот"; renderSheet();
  }
}
function wsSave(){
  if(!sheet||!sheet.res) return; wsRead();
  const r=sheet.res, D=curDay(), done=[];
  D.src=Object.assign({},D.src||{});
  if(r.steps>0){D.steps=r.steps;D.src.steps="watch";done.push("шаги "+fmt(r.steps))}
  if(r.bed&&r.wake){D.sleep={bed:r.bed,wake:r.wake,h:sleepH({bed:r.bed,wake:r.wake})};D.src.sleep="watch";done.push("сон "+String(D.sleep.h).replace(".",",")+" ч")}
  else if(r.sh>0&&r.sh<24){D.sleep={bed:"",wake:"",h:r.sh};D.src.sleep="watch";done.push("сон "+String(r.sh).replace(".",",")+" ч")}
  const on=r.acts.filter(a=>a.on);
  if(on.length){D.acts=D.acts||[];on.forEach(a=>D.acts.push({id:uid(),type:a.type,min:a.min||0,int:1,kcal:a.kcal,own:a.own,src:"watch"}));done.push(plural(on.length,"тренировка","тренировки","тренировок"))}
  if(!done.length){toast("Нечего записывать");return}
  saveDay(); closeSheet(); toast("С часов: "+done.join(", "));
}

let scrollLockY=null;
function syncScrollLock(){
  const open=!!($("#sheetRoot")&&$("#sheetRoot").children.length)||!!($("#gwinRoot")&&$("#gwinRoot").children.length);
  const b=document.body;
  if(open&&scrollLockY===null){

document.body.addEventListener("touchmove",e=>{
  if(!swp||e.touches.length!==1) return;
  const p=e.touches[0], dx=p.clientX-swp.x, dy=p.clientY-swp.y;
  if(!swp.lock&&(Math.abs(dx)>12||Math.abs(dy)>12)) swp.lock=Math.abs(dx)>Math.abs(dy)*1.5?1:-1;
  if(swp.lock===1){const v=$("#view");if(v){v.style.transition="none";v.style.transform=`translateX(${Math.max(-60,Math.min(60,dx*0.3))}px)`}}
},{passive:true});
function swipeEnd(e){
  const s=swp; swp=null; const v=$("#view");
  if(v&&v.style.transform){v.style.transition="transform .2s ease";v.style.transform="";setTimeout(()=>{v.style.transition=""},220)}
  if(!s||s.lock!==1) return;
  const p=e.changedTouches&&e.changedTouches[0]; if(!p) return;
  const dx=p.clientX-s.x, dy=p.clientY-s.y;

async function collectMoreDays(add,out){
  /* Облако отдаёт не больше 1000 документов за раз: остальные дни дочитываем по датам назад, пока 90 дней подряд пусто */
  for(const pr of S.profiles){
    let d=maxFuture(), miss=0, steps=0;
    while(miss<90&&steps<3650){
      const batch=[]; for(let i=0;i<15&&steps<3650;i++,steps++){batch.push(d);d=prevDate(d)}
      const keys=batch.map(x=>"day_"+pr.id+"_"+x);
      const vals=await Promise.all(keys.map(k=>out.days[k]?Promise.resolve(out.days[k]):Store.get(k).catch(()=>null)));
      vals.forEach((v,i)=>{if(v){miss=0;add(keys[i],v)}else miss++});
    }
  }
}

/* ---------- Штрихкод ---------- */
let zxingP=null;
function loadZXing(){
  if(window.ZXing) return Promise.resolve(window.ZXing);
  if(zxingP) return zxingP;
  zxingP=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";sc.onload=()=>window.ZXing?res(window.ZXing):rej(new Error("zxing"));sc.onerror=()=>{zxingP=null;rej(new Error("zxing load"))};document.body.appendChild(sc)});
  return zxingP;
}
const bcValid=c=>/^(\d{8}|\d{12,14})$/.test(c);
async function shrinkImage(file,max){const img=await createImageBitmap(file);const k=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);return cv}
async function decodeBarcode(file){
  try{if("BarcodeDetector" in window){const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});const r=await det.detect(await createImageBitmap(file));const c=r&&r[0]&&String(r[0].rawValue||"");if(bcValid(c))return c}}catch(e){}
  try{
    const Z=await loadZXing(), cv=await shrinkImage(file,1400), url=cv.toDataURL("image/jpeg",0.9);
    const hints=new Map(); hints.set(Z.DecodeHintType.TRY_HARDER,true); hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]);
    const res=await new Z.BrowserMultiFormatReader(hints).decodeFromImageUrl(url); const c=res&&String(res.getText()||"");
    if(bcValid(c)) return c;
  }catch(e){}
  if(AI.ok){try{const r=await AI.json(`На фото штрихкод товара. Прочитай цифры, напечатанные под штрихкодом (EAN-13 или EAN-8), и верни ТОЛЬКО JSON {"code":"4600000000000"}. Если цифры не видно — {"code":""}.`,{images:[file],modelTier:"quick"});const c=String((r&&r.code)||"").replace(/\D/g,"");if(bcValid(c))return c}catch(e){logErr("bc-claude",(e&&e.code)||"err")}}
  return null;
}
async function bcLookup(code){
  const rm=new Set(S.removed||[]);
  const pid=(S.barcodes||{})[code]; if(pid){const p=findProduct(pid);if(p&&!rm.has(p.id))return {p}}
  const own=allProducts().find(p=>p.bc===code); if(own) return {p:own};
  try{
    const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),7000);
    const r=await fetch("https://world.openfoodfacts.org/api/v2/product/"+code+".json?fields=product_name,product_name_ru,brands,nutriments",{signal:ctl.signal}); clearTimeout(tm);
    if(r.ok){const j=await r.json(), pr=j&&j.product, n=(pr&&pr.nutriments)||{};const k=num(n["energy-kcal_100g"])||num(n["energy_100g"])/4.184;
      if(k>0){const name=[(pr.product_name_ru||pr.product_name||"").trim(),String(pr.brands||"").split(",")[0].trim()].filter(Boolean).join(" ").slice(0,40)||("Продукт "+code);
        return {draft:{name,k:Math.round(k),p:Math.round(num(n.proteins_100g)*10)/10,f:Math.round(num(n.fat_100g)*10)/10,c:Math.round(num(n.carbohydrates_100g)*10)/10},src:"off"}}}
  }catch(e){}
  return null;
}
function guessCat(name){const m=name&&name.length>=3?matchProduct(normT(name)):null;return m&&m.p.cat&&m.p.cat!=="mydish"?m.p.cat:"other"}

  }
  return msg+`<label class="bcbig" for="bc-file"><span aria-hidden="true">▥</span>Сфотографировать штрихкод<small>Крупно, ровно и при хорошем свете</small></label>
    <div class="field"><label for="bc-code">Или введите цифры под штрихкодом</label><div class="bcrow"><input class="inp" id="bc-code" inputmode="numeric" maxlength="14" placeholder="4600000000000" value="${esc(s.code||"")}"><button class="btn" data-act="bcfind">Найти</button></div></div>
    <div class="muted fs12">Ищу сначала среди продуктов, которые вы${famOn()?" и семья":""} уже сохраняли со штрихкодом, потом в открытой базе Open Food Facts${""}. Если не нашлось — один раз заполните, и дальше он будет находиться сразу.</div>`;
}
function renderBcLink(){

async function bcFind(code){
  const s=sheet; if(!s||s.mode!=="scan") return;
  code=String(code||"").replace(/\D/g,"");
  if(!bcValid(code)){s.msg="Нужно 8 или 13 цифр — как под штрихкодом.";s.msgWarn=true;s.step="start";renderSheet();return}
  s.code=code; s.step="busy"; s.busyText="Ищу продукт "+code+"…"; s.msg=""; renderSheet();
  const r=await bcLookup(code); if(sheet!==s) return;
  if(r&&r.p){if(s.prod){prodQuery=r.p.name;prodFilter="all";closeSheet();toast("Уже есть в базе: "+r.p.name);return}openSheet({mode:"grams",meal:s.meal,product:r.p,g:r.p.pc||100});toast("Нашёл: "+r.p.name);return}
  if(r&&r.draft){s.draft=r.draft;s.cat=guessCat(r.draft.name);s.step="draft";s.msg="Нашёл в открытой базе Open Food Facts. Сверьте цифры с упаковкой — там бывают ошибки.";s.msgWarn=false;renderSheet();return}
  s.step="notfound"; s.msg="Штрихкод "+code+" пока не знаю. Заполните один раз — дальше он будет находиться сразу"+(famOn()?" у всей семьи":"")+"."; s.msgWarn=false; renderSheet();
}

/* ---------- Самопроверка расчётов: selfTest() в консоли, ошибки уходят в logs ---------- */
function selfTest(){
  const fails=[], eq=(name,got,want,tol)=>{const ok=typeof want==="number"?Math.abs(got-want)<=(tol||0):JSON.stringify(got)===JSON.stringify(want);if(!ok)fails.push(name+": "+JSON.stringify(got)+" ≠ "+JSON.stringify(want))};
  const r=calc({sex:"m",age:35,height:180,weight:95,act:1.375,pace:0.15,manual:0});
  eq("bmr",r.bmr,1905); eq("tdee",r.tdee,2619.375,0.001); eq("lo",r.lo,2226); eq("hi",r.hi,2357); eq("target",r.target,2292);
  const rf=calc({sex:"f",age:40,height:165,weight:70,act:1.2,pace:0.2,manual:0});
  eq("f.bmr",rf.bmr,1370.25,0.001); eq("f.floor",rf.floor,1370.25,0.001); eq("f.lo",rf.lo,1370); eq("f.capped",rf.capped,true);
  eq("manual",calc({sex:"m",age:30,height:178,weight:85,act:1.375,pace:0.15,manual:1800}).target,1800);
  eq("нет данных",calc({sex:"m",age:10,height:100,weight:20}),null);
  eq("bmi",bmiLabel(31),"ожирение"); eq("bmi2",bmiLabel(22),"норма");
  const t=totals([{k:110,p:4,f:1,c:20,g:200},{k:52,p:0.3,f:0.2,c:14,g:150}]);
  eq("totals.k",t.k,298); eq("totals.p",t.p,8.45,1e-9); eq("totals.c",t.c,61,1e-9);
  eq("sleep через полночь",sleepH({bed:"23:30",wake:"07:00"}),7.5); eq("sleep h",sleepH({h:6.2}),6.2); eq("sleep днём",sleepH({bed:"14:00",wake:"15:30"}),1.5); eq("sleep пусто",sleepH(null),0);
  eq("бег 60 мин",actKcal("run",60,1,80),784); eq("неизвестная",actKcal("zzz",30,0,70),105);
  eq("шаги",stepsKcal(10000,80),280);
  eq("миграция дня",migrateDay({acts:"x"}),{acts:[],entries:[]});
  if(fails.length) logErr("selftest",fails.join(" | "));
  return {ok:!fails.length,fails};
}
